<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FURVIVAL | The Prepared Pet System</title>
<meta name="description" content="FURVIVAL: The Prepared Pet System.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f7f6f2; --fg: #1a1a1a; --muted: #5c5c5c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #f2f2f2; --muted: #a8a8a8; } }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; padding: 16px; text-align: center;
  }
  h1 { font-size: clamp(2.75rem, 12vw, 7rem); letter-spacing: 0.04em; line-height: 1; }
  h1 .heavy { font-weight: 800; }
  h1 .light { font-weight: 300; }
  p { margin-top: 1.25rem; font-size: clamp(1rem, 3vw, 1.35rem); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
  <main>
    <h1><span class="heavy">FUR</span><span class="light">VIVAL</span></h1>
    <p>The Prepared Pet System</p>
  </main>
</body>
</html>
